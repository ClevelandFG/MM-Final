[project]
name = "mm-final"
version = "0.0.0"
description = "County road inspection route planning and audit project."
requires-python = ">=3.9"
dependencies = [
  "elkai>=2.0.1",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
